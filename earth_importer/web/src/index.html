<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earth Importer</title>
<!-- @inline-css ../../ui/vendor/leaflet/leaflet.css -->
<!-- @inline-css ../../ui/style.css -->
<!-- @inline-css style.css -->
</head>
<body>
<header class="bar">
  <label class="grow">Coordonnées
    <input id="coords" placeholder="48.8584, 2.2945" autocomplete="off">
  </label>
  <button id="go">Aller</button>
  <label>Côté (m)
    <input id="side" type="number" min="2" max="10000" step="10" value="400">
  </label>
  <button id="draw" title="Cliquer-glisser sur la carte pour dessiner un carré (Échap pour annuler)">▢ Dessiner</button>
  <label>Détail
    <select id="level"></select>
  </label>
</header>

<main id="map"></main>

<section class="bar controls">
  <label>Contenu
    <select id="content">
      <option value="geo_tex">Géométrie + textures</option>
      <option value="geo">Géométrie seule</option>
    </select>
  </label>
  <label title="Tuiles séparées, ou un seul objet avec une seule texture (atlas)">Fusion
    <select id="merge">
      <option value="0">Tuiles séparées</option>
      <option value="1">1 objet + 1 texture</option>
    </select>
  </label>
  <label title="Côté de la texture fusionnée. Auto = résolution d'origine des tuiles (jusqu'à 16384)">Atlas
    <select id="atlas">
      <option value="auto">Auto (max)</option>
      <option value="1024">1024 px</option>
      <option value="2048">2048 px</option>
      <option value="4096">4096 px</option>
      <option value="8192" selected>8192 px</option>
      <option value="16384">16384 px</option>
    </select>
  </label>
  <label title="À cocher seulement si les textures sortent à l'envers">Textures
    <span class="check"><input id="flipv" type="checkbox"> Inverser V</span>
  </label>
  <label class="grow">Nom
    <input id="name" placeholder="auto">
  </label>
  <button id="estimate" class="ghost">Estimer</button>
  <button id="cancel" class="ghost" disabled>Annuler</button>
  <span class="split">
    <button id="download" class="primary">Télécharger</button>
    <select id="fmt" title="Format d'export">
      <option value="obj">OBJ</option>
      <option value="usd">USD</option>
      <option value="glb">GLB</option>
    </select>
  </span>
</section>

<section class="progress">
  <div class="track"><div id="fill"></div></div>
  <span id="ptext">Prêt</span>
</section>

<section id="log" aria-live="polite"></section>

<!-- @inline-js ../../ui/vendor/leaflet/leaflet.js -->
<!-- @inline-js rocktree.js -->
<!-- @inline-js exporters.js -->
<!-- @inline-js merge.js -->
<!-- @inline-js app.js -->
</body>
</html>
