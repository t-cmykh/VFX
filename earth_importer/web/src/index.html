<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earth Importer</title>
<!-- @inline-css ../../ui/vendor/leaflet/leaflet.css -->
<!-- @inline-css ../../ui/style.css -->
<!-- @inline-css style.css -->
</head>
<body>
<header class="bar">
  <label class="grow place">Lieu ou coordonnées
    <input id="coords" placeholder="Tour Eiffel, Paris  —  ou  48.8584, 2.2945" autocomplete="off">
    <ul id="places" hidden></ul>
  </label>
  <button id="go">Aller</button>
  <label>Côté (m)
    <input id="side" type="number" min="2" max="10000" step="10" value="400">
  </label>
  <button id="draw" title="Cliquer-glisser sur la carte pour dessiner un carré (Échap pour annuler)">▢ Dessiner</button>
</header>

<main id="stage">
  <div id="map"></div>
  <div id="viewer" hidden></div>
  <div class="tabs">
    <button id="tab-map" class="active">Carte</button><button id="tab-3d" disabled title="Cliquer sur Tester pour voir la géométrie avant de la télécharger">Aperçu 3D</button>
  </div>
</main>

<section class="bar controls">
  <label>Contenu
    <select id="content">
      <option value="geo_tex">Géométrie + textures</option>
      <option value="none">Rien (LiDAR seul)</option>
    </select>
  </label>
  <label title="LiDAR HD de l'IGN (France) : maillage dans le même repère que la 3D Google">LiDAR IGN
    <select id="lidar">
      <option value="none">Aucun</option>
      <option value="mns">MNS (surface)</option>
      <option value="mnt">MNT (sol nu)</option>
      <option value="both">MNS + MNT</option>
    </select>
  </label>
  <label title="Projette la texture de la 3D Google (vue de dessus) sur le maillage LiDAR. Demande Contenu = Géométrie + textures">Texture LiDAR
    <select id="lidartex">
      <option value="0">Aucune</option>
      <option value="2048">Google 2048 px</option>
      <option value="4096" selected>Google 4096 px</option>
      <option value="8192">Google 8192 px</option>
    </select>
  </label>
  <label title="Tuiles séparées, ou un seul objet avec une seule texture (atlas)">Fusion
    <select id="merge">
      <option value="0">Tuiles séparées</option>
      <option value="1">1 objet + 1 texture</option>
    </select>
  </label>
  <label title="Côté de la texture fusionnée. Auto = résolution d'origine des tuiles (jusqu'à 16384)">Atlas
    <select id="atlas">
      <option value="auto">Auto (max)</option>
      <option value="1024">1024 px</option>
      <option value="2048">2048 px</option>
      <option value="4096">4096 px</option>
      <option value="8192" selected>8192 px</option>
      <option value="16384">16384 px</option>
    </select>
  </label>
  <label class="grow">Nom
    <input id="name" placeholder="auto">
  </label>
  <button id="estimate" class="ghost" title="Télécharge un aperçu et l'affiche en 3D (le téléchargement final réutilise ce qui a déjà été reçu)">Tester</button>
  <button id="cancel" class="ghost" disabled>Annuler</button>
  <span class="split">
    <button id="download" class="primary">Télécharger</button>
    <select id="fmt" title="Format d'export">
      <option value="obj">OBJ</option>
      <option value="usd">USD</option>
    </select>
  </span>
</section>

<section class="progress">
  <div class="track"><div id="fill"></div></div>
  <span id="ptext">Prêt</span>
</section>

<section id="log" aria-live="polite"></section>

<!-- @inline-js ../../ui/vendor/leaflet/leaflet.js -->

</body>
</html>
