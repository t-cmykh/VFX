<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earth Importer</title>
<link rel="stylesheet" href="/ui/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/ui/style.css">
</head>
<body>
<header class="bar">
  <label class="grow place">Lieu ou coordonnées
    <input id="coords" placeholder="Tour Eiffel, Paris  —  ou  48.8584, 2.2945" autocomplete="off">
    <ul id="places" hidden></ul>
  </label>
  <button id="go">Aller</button>
  <label>Rayon (m)
    <input id="radius" type="number" min="1" max="5000" step="10" value="200">
  </label>
</header>

<main id="stage">
  <div id="map"></div>
  <div id="viewer" hidden></div>
  <div class="tabs">
    <button id="tab-map" class="active">Carte</button><button id="tab-3d" disabled title="Cliquer sur Tester pour voir la géométrie avant de la télécharger">Aperçu 3D</button>
  </div>
</main>

<section class="bar controls">
  <label>Contenu
    <select id="content">
      <option value="geo_tex">Géométrie + textures</option>
      <option value="geo">Géométrie seule</option>
      <option value="none">Rien (LiDAR seul)</option>
    </select>
  </label>
  <label title="LiDAR HD de l'IGN (France) : maillage dans le même repère que la 3D Google">LiDAR IGN
    <select id="lidar">
      <option value="none">Aucun</option>
      <option value="mns">MNS (surface)</option>
      <option value="mnt">MNT (sol nu)</option>
      <option value="both">MNS + MNT</option>
    </select>
  </label>
  <label title="Pas de la grille LiDAR. 0,5 m = résolution native">Pas
    <select id="lidarres">
      <option value="0.5">0,5 m</option>
      <option value="1" selected>1 m</option>
      <option value="2">2 m</option>
      <option value="5">5 m</option>
    </select>
  </label>
  <label title="Dalles brutes du nuage de points LiDAR HD (1 km², 0,5 à 2 Go chacune, Lambert-93)">Nuage
    <span class="check"><input id="laz" type="checkbox"> Dalles LAZ</span>
  </label>
  <label class="grow">Dossier de sortie
    <span class="row"><input id="outdir"><button id="pick" hidden title="Choisir un dossier">📁</button></span>
  </label>
  <label>Nom
    <input id="name" placeholder="auto">
  </label>
  <button id="estimate" class="ghost" title="Télécharge un aperçu et l'affiche en 3D (le téléchargement final réutilise ce qui a déjà été reçu)">Tester</button>
  <button id="cancel" class="ghost" disabled>Annuler</button>
  <span class="split">
    <button id="download" class="primary">Télécharger</button>
    <select id="fmt" title="Format d'export">
      <option value="obj">OBJ</option>
      <option value="abc">ABC</option>
      <option value="usd">USD</option>
    </select>
  </span>
</section>

<section class="progress">
  <div class="track"><div id="fill"></div></div>
  <span id="ptext">Prêt</span>
</section>

<section id="log" aria-live="polite"></section>

<script src="/ui/vendor/leaflet/leaflet.js"></script>
<script src="/ui/vendor/three/three.min.js"></script>
<script src="/ui/vendor/three/OrbitControls.js"></script>
<script src="/ui/geocode.js"></script>
<script src="/ui/preview.js"></script>
<script src="/ui/app.js"></script>
</body>
</html>
